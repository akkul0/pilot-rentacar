name: Import generated media

# Downloads the files listed in .github/media-import.tsv, verifies each
# checksum and commits them to the branch that was pushed. Files already in
# the repo with a matching checksum are skipped.
on:
  push:
    paths:
      - .github/media-import.tsv
      - .github/workflows/import-media.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: import-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download and verify
        id: download
        run: |
          set -euo pipefail
          changed=0
          while read -r path url sha size; do
            case "$path" in ''|\#*) continue ;; esac
            case "$path" in
              public/assets/*) ;;
              *) echo "Refusing path outside public/assets: $path"; exit 1 ;;
            esac
            case "$path" in *..*) echo "Refusing path: $path"; exit 1 ;; esac
            if [ -f "$path" ] && echo "$sha  $path" | sha256sum -c --status; then
              continue
            fi
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 4 --retry-delay 3 -o "$path.part" "$url"
            echo "$sha  $path.part" | sha256sum -c -
            mv "$path.part" "$path"
            changed=1
          done < .github/media-import.tsv
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commit imported media
        if: steps.download.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/assets
          git commit -m "Import generated media from manifest"
          git push origin "HEAD:${{ github.ref_name }}"

      # Pushes made with GITHUB_TOKEN do not start other workflows, so ask the
      # Pages workflow to rebuild with the imported files.
      - name: Rebuild Pages
        if: steps.download.outputs.changed == '1' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
